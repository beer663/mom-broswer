name: Build Mom Browser

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '23 11 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - name: Bundle the latest stable uBlock Origin
        run: python3 .github/scripts/install-ublock.py

      - name: Build GeckoView version
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGenericGeckoIncludedDebug

      - name: Rename APK for Release
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/genericGeckoIncluded/debug/*.apk release-files/Mom-Browser-Debug.apk

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build
          name: Mom Browser Debug Build
          files: release-files/Mom-Browser-Debug.apk
          draft: false
          prerelease: true
