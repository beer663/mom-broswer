name: Build Mom Browser

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Triggers a release automatically when you push a tag like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a GitHub Release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build GeckoView version
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGenericGeckoIncludedDebug
        *Verification:* Gradle finishes with a `BUILD SUCCESSFUL` message.

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/genericGeckoIncluded/debug/*.apk
          draft: false
          prerelease: false
        *Verification:* The step finishes successfully and a new release appears on your main repository page under **Releases**.
