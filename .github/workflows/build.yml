name: Build Mom Broswer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build GeckoView version
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGenericGeckoIncludedDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Mom-Broswer-GeckoView-APK
          path: app/build/outputs/apk/genericGeckoIncluded/debug/*.apk
