name: Build Mom Browser

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build GeckoView version
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGenericGeckoIncludedDebug

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build
          name: "Mom Browser Debug Build"
          files: app/build/outputs/apk/genericGeckoIncluded/debug/*.apk
          draft: false
          prerelease: true
          overwrite: true
